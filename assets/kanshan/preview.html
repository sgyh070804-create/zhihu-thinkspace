<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>刘看山 · 网格模型检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e7e7e3;color:#26372e;font:14px system-ui}header{position:absolute;left:24px;top:20px;z-index:2}h1{font-size:22px;font-weight:500;margin:0 0 8px}p{font-size:12px;color:#66736a}#controls{position:absolute;bottom:25px;left:20px;right:20px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:2}button,a{border:1px solid #ccd2ca;border-radius:20px;padding:10px 16px;background:#ffffffdc;color:#324f40;text-decoration:none;font:12px system-ui;cursor:pointer}button.active{background:#365c47;color:#fff}canvas{display:block;width:100%;height:100dvh}#status{font-variant-numeric:tabular-nums}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#e7e7e3;z-index:3}#loading[hidden]{display:none}</style>
<header><h1>刘看山 · 三维网格</h1><p>拖动旋转 · 滚轮缩放 · 右键平移</p><p id="status">载入实际 GLB 模型…</p></header><canvas id="model"></canvas><div id="loading">正在载入网格与骨骼…</div>
<nav id="controls"><button data-view="hero">三分之四</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button id="wire">线框</button><button id="rig">骨骼</button><a href="kanshan-reference-model.glb" download>下载 GLB</a></nav>
<script type="importmap">{"imports":{"three":"./viewer-vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './viewer-vendor/GLTFLoader.js';import {OrbitControls} from './viewer-vendor/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor('#e7e7e3');renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.9,0);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=16;
scene.add(new THREE.HemisphereLight(0xffffff,0x9ca99a,2));const key=new THREE.DirectionalLight(0xfff9ee,3);key.position.set(-4,7,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=6;key.shadow.camera.bottom=-4;key.shadow.bias=-.0005;scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1);fill.position.set(4,4,-3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#dddeda',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let model,skeleton,wire=false;const materials=[];
function view(name){const poses={hero:[6,4.4,9],front:[0,1.9,10],side:[10,1.9,0],back:[0,1.9,-10]};camera.position.set(...poses[name]);controls.target.set(0,1.9,0);controls.update();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.querySelector('#wire').onclick=e=>{wire=!wire;materials.forEach(m=>m.wireframe=wire);e.target.classList.toggle('active',wire);};document.querySelector('#rig').onclick=e=>{if(skeleton){skeleton.visible=!skeleton.visible;e.target.classList.toggle('active',skeleton.visible);}};
new GLTFLoader().load('./kanshan-reference-model.glb',g=>{model=g.scene;scene.add(model);let vertices=0,triangles=0,bones=0,meshes=0;model.traverse(o=>{if(o.isMesh){o.castShadow=true;meshes++;vertices+=o.geometry.attributes.position.count;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;for(const m of [o.material].flat())if(!materials.includes(m))materials.push(m);}if(o.isBone)bones++;});skeleton=new THREE.SkeletonHelper(model);skeleton.visible=false;skeleton.material.depthTest=false;scene.add(skeleton);document.querySelector('#status').textContent=`${meshes} 个网格 · ${vertices.toLocaleString()} 顶点 · ${Math.round(triangles).toLocaleString()} 三角面 · ${bones} 骨骼`;document.querySelector('#loading').hidden=true;},undefined,e=>{document.querySelector('#loading').textContent='载入失败：请通过本地 HTTP 服务打开。';console.error(e);});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();view('hero');renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
