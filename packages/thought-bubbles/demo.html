<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThinkSpace · 薄膜光学与软体融合 v0.1.0</title><link rel="stylesheet" href="dist/thought-bubbles.css"><style>
*{box-sizing:border-box}body{margin:0;background:#faf9fd;color:#343345;--thinkspace-font:Georgia, "Songti SC", serif;font-family:var(--thinkspace-font)}header{height:74px;display:flex;align-items:center;gap:42px;padding:0 4%;border-bottom:1px solid #eae6f1}header strong{font-size:25px;font-weight:400}header span{font-size:13px;color:#82788f}header small{margin-left:auto;color:#8b819a;font-size:11px}main{position:relative}#space{height:calc(100dvh - 185px);min-height:480px}.intro{position:absolute;top:30px;left:4%;z-index:2;pointer-events:none;transition:opacity .4s}.intro h1{font-weight:400;font-size:32px;letter-spacing:.07em;margin:0 0 10px}.intro p{font-size:12px;color:#8a8196;margin:0}.tools{min-height:66px;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap;border-top:1px solid #eee9f4}button,select{font-family:inherit;font-size:12px;color:#6c627e;border:1px solid #e3ddeb;background:#ffffffb0;padding:9px 14px;border-radius:24px;cursor:pointer}.tools button:hover{background:white;border-color:#bcb0cd}dialog{border:1px solid #e6e0ee;border-radius:24px;max-width:460px;width:90%;padding:32px;color:#443c52;background:#faf8ff;box-shadow:0 20px 100px #4e38601a}dialog::backdrop{background:#eeeaf166;backdrop-filter:blur(5px)}dialog p{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}dialog small{color:#8a8196}#status{font-size:10px;color:#8d839b;min-width:110px}@media(max-width:600px){header{gap:20px}.intro h1{font-size:24px}header small{display:none}#space{min-height:540px}.intro p{max-width:270px;line-height:1.8}}
main:has(.tb-inside) .intro{opacity:0}</style></head><body><header><strong>ThinkSpace</strong><span>思绪空间</span><small>首版 / 薄膜反光 · 流动纹理 · 软体碰撞</small></header><main><div class="intro"><h1>让想法，自由相遇。</h1><p>泡泡持续游动。点击走进泡泡，拖动让想法相遇。</p></div><div id="space"></div></main><div class="tools"><button id="pause">暂停游动</button><button id="undo">撤销融合</button><select id="first" aria-label="第一个想法"></select><span style="color:#aaa">＋</span><select id="second" aria-label="第二个想法"></select><button id="merge">观看挤压与融合</button><button id="inspect">定格液桥</button><input id="timeline" aria-label="融合进度" type="range" min="0" max="99" value="50" style="width:90px"><button id="slow">慢镜观察：关</button><button id="reset">重新开始</button><span id="status"></span></div><script src="dist/bubble-physics.js"></script><script src="dist/thought-bubbles.js"></script><script>
const initial=[{id:'reading',text:'阅读不是收集，\n而是建立连接',source:'来自 · 阅读笔记',x:.20,y:.46,radius:125},{id:'forget',text:'遗忘，也许是\n筛选的一部分',source:'来自 · 阅读笔记',x:.47,y:.35,radius:108},{id:'question',text:'把问题\n留下来',source:'来自 · 随手记',x:.80,y:.32,radius:82},{id:'doubt',text:'记录当下\n的疑惑',source:'来自 · 阅读笔记',x:.38,y:.77,radius:105},{id:'different',text:'不同观点之间，\n藏着新的问题',source:'来自 · 阅读笔记',x:.76,y:.73,radius:120}];
let serial=0,paused=false;const first=document.querySelector('#first'),second=document.querySelector('#second'),statusEl=document.querySelector('#status');
function update(items){const oldA=first.value,oldB=second.value;[first,second].forEach(s=>{s.replaceChildren();items.forEach(i=>{const o=document.createElement('option');o.value=i.id;o.textContent=i.text.replace(/\n/g,'').slice(0,12);s.appendChild(o);});});first.value=items.some(i=>i.id===oldA)?oldA:items[0]?.id||'';second.value=items.some(i=>i.id===oldB)&&oldB!==first.value?oldB:items.find(i=>i.id!==first.value)?.id||'';}
window.demo=ThoughtBubbles.create('#space',{items:initial,onMerge:async(a,b)=>{await new Promise(r=>setTimeout(r,450));return{id:'merged-'+(++serial),text:'让不同的想法相遇，\n把连接变成新的问题',source:'融合演示 · 示例文案，未调用 AI'};},onChange:update,onError:e=>{statusEl.textContent=e.message;}});update(initial);
document.querySelector('#inspect').onclick=()=>{demo.setMotionRate(0);demo.merge(first.value,second.value).catch(e=>statusEl.textContent=e.message);setTimeout(()=>demo.seekMerge(.5),650);};document.querySelector('#timeline').oninput=e=>{demo.setMotionRate(0);demo.seekMerge(Number(e.target.value)/100);};let slow=false;document.querySelector('#slow').onclick=e=>{slow=!slow;demo.setMotionRate(slow?.25:1);e.target.textContent='慢镜观察：'+(slow?'开':'关');};document.querySelector('#pause').onclick=e=>{paused=!paused;paused?demo.pause():demo.resume();e.target.textContent=paused?'继续游动':'暂停游动';};document.querySelector('#undo').onclick=()=>demo.undo();document.querySelector('#reset').onclick=()=>{try{demo.setItems(initial);update(initial);}catch(e){statusEl.textContent=e.message;}};document.querySelector('#merge').onclick=async e=>{e.target.disabled=true;try{await demo.merge(first.value,second.value);}catch(e){statusEl.textContent=e.message;}finally{document.querySelector('#merge').disabled=false;}};setInterval(()=>{const s=demo.getStats();statusEl.textContent=s.renderer+' · '+(s.reducedMotion?'减少动态':Math.round(s.averageFps)+' rAF/s');},1000);
</script></body></html>
